name: Sync claude branches into main

# daily-news 的 GitHub Pages 是 legacy 模式，直接從 main 根目錄部署，push 到 main 會自動重新發布。
# 這個 workflow 只負責：如果產生當天頁面的 session 被限制在 claude/* 分支上開發，
# 自動把該分支最新一天的頁面同步進 main，讓內容真正落地、觸發 Pages 重新部署，
# 不需要額外寄信通知或手動操作。
on:
  push:
    branches: [main, 'claude/**']
    paths: ['2*.html', 'index.html', 'scripts/add_nav.py', '.github/workflows/sync-main.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch source branch
        if: github.ref_name != 'main'
        run: git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
      - name: Sync latest day into main
        if: github.ref_name != 'main'
        run: scripts/sync_latest.sh "${GITHUB_REF_NAME}"
      - name: Refresh date navigation
        run: |
          python3 scripts/add_nav.py
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Refresh date navigation"
          fi
      - name: Push main
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
